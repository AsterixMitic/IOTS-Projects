# Network
listener 1883
allow_anonymous true

# Persistence — važno za Scenario B (recovery nakon disconnecta)
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# QoS 2 zahteva persist queue
queue_qos0_messages false
max_queued_messages 10000
max_inflight_messages 100

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S