services:
  postgres:
    image: postgres:16-alpine
    container_name: project-one-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest-service-csharp:
    build:
      context: ./rest-service-csharp
      dockerfile: Dockerfile
    container_name: project-one-rest-service-csharp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5000:8080"
    restart: unless-stopped

  grpc-service-go:
    build:
      context: ./grpc-service-go
      dockerfile: Dockerfile
    container_name: project-one-grpc-service-go
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - GRPC_PORT=50051
    ports:
      - "50051:50051"
    restart: unless-stopped

  graphql-service-rust:
    build:
      context: ./graphql-service-rust
      dockerfile: Dockerfile
    container_name: project-one-graphql-service-rust
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
