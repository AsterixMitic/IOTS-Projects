services:
  postgres:
    image: postgres:16-alpine
    container_name: project-one-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest-service-csharp:
    build:
      context: ./rest-service-csharp
      dockerfile: Dockerfile
    container_name: project-one-rest-service-csharp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5000:8080"
    restart: unless-stopped

  grpc-service-go:
    build:
      context: ./grpc-service-go
      dockerfile: Dockerfile
    container_name: project-one-grpc-service-go
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - GRPC_PORT=50051
    ports:
      - "50051:50051"
    restart: unless-stopped

  graphql-service-rust:
    build:
      context: ./graphql-service-rust
      dockerfile: Dockerfile
    container_name: project-one-graphql-service-rust
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
    ports:
      - "8000:8000"
    restart: unless-stopped

  docker-stats-exporter:
    build:
      context: ./monitoring/docker-stats-exporter
      dockerfile: Dockerfile
    container_name: project-one-docker-stats-exporter
    depends_on:
      - postgres
      - rest-service-csharp
      - grpc-service-go
      - graphql-service-rust
    ports:
      - "9101:9101"
    environment:
      - DOCKER_STATS_INTERVAL=5
      - COMPOSE_PROJECT=project-one
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: project-one-prometheus
    depends_on:
      - docker-stats-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: project-one-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
