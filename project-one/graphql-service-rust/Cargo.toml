[package]
name = "graphql_service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "graphql_service"
path = "src/main.rs"

[dependencies]
actix-web = "4.4"
actix-rt = "2.9"
sqlx = { version = "0.7.3", features = ["postgres", "chrono", "uuid", "runtime-tokio-native-tls"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dotenv = "0.15"

[dev-dependencies]
