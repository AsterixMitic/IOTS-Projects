# Projekat 3 — MQTT-only stack (Faza 0 scaffolding).
# Servisi iz Projekta 2 (ingestion, storage, analytics) + Postgres i Mosquitto.
# eKuiper, MaaS i Blazor web se dodaju u kasnijim fazama.

services:
  postgres:
    image: postgres:16-alpine
    container_name: project-three-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-primeni šemu + seed (devices, sensor_types) pri prvom podizanju baze.
      - ./db/0001_schema_and_staging.up.sql:/docker-entrypoint-initdb.d/0001_schema_and_staging.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: project-three-mosquitto
    ports:
      - "1883:1883"   # TCP (servisi)
      - "9001:9001"   # WebSockets (web klijenti)
    volumes:
      - ./brokers/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingestion:
    build:
      context: ./services/ingestion
    container_name: project-three-ingestion
    env_file:
      - .env
    environment:
      SERVICE_NAME: ingestion
      PORT: 3000
      BROKER_MODE: ${BROKER_MODE:-mqtt}
      MQTT_TOPIC: ${MQTT_TOPIC:-iot/readings}
      MQTT_QOS: ${MQTT_QOS:-1}
    ports:
      - "3000:3000"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  storage:
    build:
      context: ./services/storage
    container_name: project-three-storage
    env_file:
      - .env
    environment:
      BROKER_MODE: ${BROKER_MODE:-mqtt}
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=iot_events;Username=iot;Password=change-me}
      DATABASE_URL: ${DATABASE_URL:-Host=postgres;Port=5432;Database=iot_events;Username=iot;Password=change-me}
      ASPNETCORE_URLS: http://+:8080
      MQTT_TOPIC: ${MQTT_TOPIC:-iot/readings}
      MQTT_STORED_TOPIC: ${MQTT_STORED_TOPIC:-iot/stored}
      STORAGE_REPUBLISH: ${STORAGE_REPUBLISH:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build:
      context: ./services/analytics
    container_name: project-three-analytics
    env_file:
      - .env
    environment:
      SERVICE_NAME: analytics
      PORT: 3001
      BROKER_MODE: ${BROKER_MODE:-mqtt}
      # Faza 1: Analytics se pretplaćuje na iot/stored (topic na koji Storage re-publikuje).
      MQTT_TOPIC: ${MQTT_STORED_TOPIC:-iot/stored}
      MQTT_QOS: ${MQTT_QOS:-1}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-10}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-50}
    ports:
      - "3001:3001"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
