# Projekat 3 — MQTT-only stack (Faza 0 scaffolding).
# Servisi iz Projekta 2 (ingestion, storage, analytics) + Postgres i Mosquitto.
# eKuiper, MaaS i Blazor web se dodaju u kasnijim fazama.

services:
  postgres:
    image: postgres:16-alpine
    container_name: project-three-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-primeni šemu + seed (devices, sensor_types) pri prvom podizanju baze.
      - ./db/0001_schema_and_staging.up.sql:/docker-entrypoint-initdb.d/0001_schema_and_staging.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: project-three-mosquitto
    ports:
      - "1883:1883"   # TCP (servisi)
      - "9001:9001"   # WebSockets (web klijenti)
    volumes:
      - ./brokers/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingestion:
    build:
      context: ./services/ingestion
    container_name: project-three-ingestion
    env_file:
      - .env
    environment:
      SERVICE_NAME: ingestion
      PORT: 3000
      BROKER_MODE: ${BROKER_MODE:-mqtt}
      MQTT_TOPIC: ${MQTT_TOPIC:-iot/readings}
      MQTT_QOS: ${MQTT_QOS:-1}
    ports:
      - "3000:3000"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  storage:
    build:
      context: ./services/storage
    container_name: project-three-storage
    env_file:
      - .env
    environment:
      BROKER_MODE: ${BROKER_MODE:-mqtt}
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=iot_events;Username=iot;Password=change-me}
      DATABASE_URL: ${DATABASE_URL:-Host=postgres;Port=5432;Database=iot_events;Username=iot;Password=change-me}
      ASPNETCORE_URLS: http://+:8080
      MQTT_TOPIC: ${MQTT_TOPIC:-iot/readings}
      MQTT_STORED_TOPIC: ${MQTT_STORED_TOPIC:-iot/stored}
      STORAGE_REPUBLISH: ${STORAGE_REPUBLISH:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build:
      context: ./services/analytics
    container_name: project-three-analytics
    env_file:
      - .env
    environment:
      SERVICE_NAME: analytics
      PORT: 3001
      BROKER_MODE: ${BROKER_MODE:-mqtt}
      # Faza 4: Analytics konzumira iot/stored (očitavanja) + iot/events (eKuiper CEP),
      # zove MaaS po prozoru i objedinjeni rezime publikuje na iot/analytics.
      MQTT_STORED_TOPIC: ${MQTT_STORED_TOPIC:-iot/stored}
      MQTT_EVENTS_TOPIC: ${MQTT_EVENTS_TOPIC:-iot/events}
      MQTT_ANALYTICS_TOPIC: ${MQTT_ANALYTICS_TOPIC:-iot/analytics}
      MAAS_URL: ${MAAS_URL:-http://maas:8000}
      MAAS_ENABLED: ${MAAS_ENABLED:-true}
      MQTT_QOS: ${MQTT_QOS:-1}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-10}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-50}
    ports:
      - "3001:3001"
    depends_on:
      mosquitto:
        condition: service_healthy
      maas:
        condition: service_started
    restart: unless-stopped

  # eKuiper — streaming/CEP engine. Pretplaćen na iot/stored, pravila emituju
  # događaje od interesa na iot/events (Projekat 3, Faza 3).
  ekuiper:
    image: lfedge/ekuiper:1.14
    container_name: project-three-ekuiper
    environment:
      # Override MQTT source servera (etc/mqtt_source.yaml -> default.server).
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mosquitto:1883"
      MQTT_SOURCE__DEFAULT__QOS: "1"
      KUIPER__BASIC__CONSOLELOG: "true"
    ports:
      - "9081:9081"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  # Jednokratni init: registruje stream + pravila preko eKuiper REST API-ja.
  ekuiper-init:
    image: curlimages/curl:latest
    container_name: project-three-ekuiper-init
    depends_on:
      ekuiper:
        condition: service_started
    volumes:
      - ./ekuiper:/defs:ro
    entrypoint: ["sh", "/defs/provision.sh"]
    restart: "no"

  # MaaS — Model-as-a-Service (Python + FastAPI + scikit-learn).
  # Klasifikacija kvaliteta vazduha; Analytics ga zove preko REST-a (Faza 4).
  maas:
    build:
      context: ./services/maas
    container_name: project-three-maas
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Web dashboard (Blazor Server) — live prikaz analitike (Faza 5).
  # Server-side MQTT pretplata + SignalR push. Otvoriti http://localhost:8090
  web:
    build:
      context: ./services/web
    container_name: project-three-web
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_STORED_TOPIC: ${MQTT_STORED_TOPIC:-iot/stored}
      MQTT_EVENTS_TOPIC: ${MQTT_EVENTS_TOPIC:-iot/events}
      MQTT_ANALYTICS_TOPIC: ${MQTT_ANALYTICS_TOPIC:-iot/analytics}
      MAAS_URL: ${MAAS_URL:-http://maas:8000}
    ports:
      - "8090:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
